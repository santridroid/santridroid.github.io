<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SANTRIDROID - Tools for Shopee Affiliate</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #eef2f6;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            padding: 12px 10px 88px 10px;
            position: relative;
        }

        /* Smooth button transitions */
        .btn-press {
            transition: all 0.15s ease-in-out;
            user-select: none;
        }
        .btn-press:active {
            transform: scale(0.97);
            filter: brightness(0.92);
        }

        /* Floating Action Button (+) di pojok kiri bawah */
        .fab-add {
            position: fixed;
            bottom: 22px;
            left: 22px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: #00897b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 4px 14px rgba(0, 137, 123, 0.45);
            cursor: pointer;
            border: none;
            z-index: 999;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
        }
        .fab-add:hover {
            background-color: #00796b;
            transform: scale(1.06);
        }
        .fab-add:active {
            transform: scale(0.94);
        }

        /* Toast message */
        #toast {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 10000;
            pointer-events: none;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Modal transitions */
        .modal-backdrop {
            transition: opacity 0.2s ease-in-out;
        }
        .modal-content {
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Scrollbar styling */
        textarea::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-4 text-center relative overflow-hidden">
        <div class="flex items-center justify-center gap-2 mb-1">
            <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-orange-500 text-white shadow-sm shadow-orange-300">
                <i class="fa-solid fa-bolt-lightning text-sm"></i>
            </span>
            <h1 class="text-xl font-black tracking-wider text-slate-800">SANTRIDROID</h1>
        </div>
        <p class="text-xs font-semibold text-slate-500 tracking-wide">Tools for Shopee Affiliate</p>
    </header>

    <!-- LIST OF BUTTON PACKAGES -->
    <main id="button-list" class="space-y-3">
        <!-- Rendered dynamically via JavaScript -->
    </main>

    <!-- EMPTY STATE -->
    <div id="empty-state" class="hidden text-center py-16 px-4">
        <div class="w-16 h-16 rounded-full bg-slate-200 text-slate-400 flex items-center justify-center mx-auto mb-3 text-2xl">
            <i class="fa-solid fa-cubes"></i>
        </div>
        <h3 class="text-sm font-bold text-slate-700">Belum ada paket tombol</h3>
        <p class="text-xs text-slate-400 mt-1">Klik tombol (+) di pojok kiri bawah untuk membuat tombol baru.</p>
    </div>

</div>

<!-- FLOATING ACTION BUTTON (+) DI POJOK KIRI BAWAH -->
<button class="fab-add" onclick="addNewButtonPackage()" title="Tambah Paket Tombol" aria-label="Tambah Paket Tombol">
    <i class="fa-solid fa-plus"></i>
</button>

<!-- POPUP MODAL EDIT PENGATURAN TOMBOL -->
<div id="edit-modal" onclick="if(event.target === this) closeEditModal()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden modal-backdrop">
    <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl border border-slate-100 overflow-hidden transform scale-95 modal-content">
        <!-- Modal Header -->
        <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center text-xs">
                    <i class="fa-solid fa-sliders"></i>
                </div>
                <h3 class="font-bold text-slate-800 text-sm">Pengaturan Tombol</h3>
            </div>
            <button onclick="closeEditModal()" class="w-7 h-7 rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-200 flex items-center justify-center text-xs transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Modal Body Form -->
        <form id="edit-form" onsubmit="saveButtonSettings(event)" class="p-5 space-y-4 max-h-[75vh] overflow-y-auto">
            <input type="hidden" id="edit-btn-id">
            <input type="hidden" id="edit-btn-color-index">

            <!-- 1. Nama Tombol -->
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">
                    <i class="fa-solid fa-tag text-slate-400 mr-1"></i> (1). Nama Tombol
                </label>
                <input type="text" id="edit-btn-name" required placeholder="Contoh: Copy Link Shopee"
                    class="w-full text-xs font-semibold px-3 py-2.5 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-800 transition">
            </div>

            <!-- 2. Isi Tautan atau Teks -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="text-xs font-bold text-slate-700">
                        <i class="fa-solid fa-list-check text-slate-400 mr-1"></i> (2). Isi Tautan / Teks
                    </label>
                    <span id="content-line-count" class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded font-mono">0 baris</span>
                </div>
                <textarea id="edit-btn-content" rows="5" placeholder="Masukkan link atau teks (1 baris = 1 data):&#10;https://shope.ee/contoh1&#10;https://shope.ee/contoh2&#10;VOUCHER50RB"
                    class="w-full text-xs font-mono px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-800 resize-none leading-relaxed transition"
                    oninput="updateContentLineCount()"></textarea>
                <p class="text-[10px] text-slate-400 mt-1">Tekan Enter untuk memisahkan setiap link atau teks.</p>
            </div>

            <!-- 3. Dropdown Mode Pemilihan Teks (ROTATOR atau SINGLE) -->
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">
                    <i class="fa-solid fa-arrows-rotate text-slate-400 mr-1"></i> (3). Mode Pemilihan Teks
                </label>
                <select id="edit-btn-selector-mode"
                    class="w-full text-xs font-semibold px-3 py-2.5 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-800 bg-white transition">
                    <option value="ROTATOR">ROTATOR (Berubah berurutan dari daftar list)</option>
                    <option value="SINGLE">SINGLE (Selalu teks di baris paling atas / pertama)</option>
                </select>
            </div>

            <!-- 4. Pilihan Mode Aksi (COPY atau OPEN) -->
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">
                    <i class="fa-solid fa-hand-pointer text-slate-400 mr-1"></i> (4). Mode Aksi
                </label>
                <select id="edit-btn-action-mode"
                    class="w-full text-xs font-semibold px-3 py-2.5 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-800 bg-white transition">
                    <option value="COPY">COPY (Salin teks/link ke Clipboard)</option>
                    <option value="OPEN">OPEN (Buka link di Browser Eksternal)</option>
                </select>
            </div>

            <!-- Opsi Tambahan: Cut Mode -->
            <div class="bg-amber-50 border border-amber-200 rounded-lg p-2.5">
                <label class="flex items-start gap-2 cursor-pointer">
                    <input type="checkbox" id="edit-btn-cut-mode" class="mt-0.5 w-4 h-4 text-orange-600 rounded border-slate-300 focus:ring-orange-500">
                    <span class="text-[11px] text-amber-900 leading-tight">
                        <strong>Mode Cut:</strong> Hapus baris teks dari daftar setelah berhasil disalin/dibuka (jumlah otomatis berkurang).
                    </span>
                </label>
            </div>

            <!-- Pilihan Warna Tombol -->
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">
                    <i class="fa-solid fa-palette text-slate-400 mr-1"></i> Warna Tombol
                </label>
                <div id="color-picker-container" class="flex flex-wrap gap-1.5">
                    <!-- Rendered by JS -->
                </div>
            </div>

            <!-- Tombol Aksi Modal -->
            <div class="pt-2 flex items-center justify-between gap-2 border-t border-slate-100">
                <button type="button" onclick="deleteCurrentButtonPackage()" class="text-xs font-bold text-red-600 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-2 rounded-lg transition">
                    <i class="fa-solid fa-trash-can mr-1"></i> Hapus
                </button>
                <div class="flex items-center gap-2">
                    <button type="button" onclick="closeEditModal()" class="text-xs font-bold text-slate-600 hover:text-slate-800 px-3 py-2 rounded-lg hover:bg-slate-100 transition">
                        Batal
                    </button>
                    <button type="submit" class="text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg shadow-sm transition">
                        <i class="fa-solid fa-check mr-1"></i> Simpan
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- TOAST NOTIFICATION -->
<div id="toast" class="bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-xl flex items-center gap-2 text-xs font-medium max-w-[90vw]">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
    <span id="toast-message" class="truncate">Operasi berhasil</span>
</div>

<script>
    // Palet warna cerah dan kaya kontras (berurutan untuk setiap tombol baru yang ditambahkan)
    const COLOR_PALETTE = [
        { bg: '#f39c12', hover: '#e67e22', shadow: 'rgba(243, 156, 18, 0.35)', name: 'Orange' },
        { bg: '#8e44ad', hover: '#7d3c98', shadow: 'rgba(142, 68, 173, 0.35)', name: 'Purple' },
        { bg: '#2e86de', hover: '#1e70bf', shadow: 'rgba(46, 134, 222, 0.35)', name: 'Blue' },
        { bg: '#27ae60', hover: '#219653', shadow: 'rgba(39, 174, 96, 0.35)', name: 'Green' },
        { bg: '#16a085', hover: '#117a65', shadow: 'rgba(22, 160, 133, 0.35)', name: 'Teal' },
        { bg: '#e84393', hover: '#d63031', shadow: 'rgba(232, 67, 147, 0.35)', name: 'Pink' },
        { bg: '#e74c3c', hover: '#c0392b', shadow: 'rgba(231, 76, 60, 0.35)', name: 'Red' },
        { bg: '#3f51b5', hover: '#303f9f', shadow: 'rgba(63, 81, 181, 0.35)', name: 'Indigo' },
        { bg: '#d35400', hover: '#ba4a00', shadow: 'rgba(211, 84, 0, 0.35)', name: 'Amber' },
        { bg: '#0284c7', hover: '#0369a1', shadow: 'rgba(2, 132, 199, 0.35)', name: 'Sky' }
    ];

    const STORAGE_KEY = 'santridroid_shopee_buttons_v1';

    // Preset data tombol awal jika storage masih kosong
    const DEFAULT_BUTTONS = [
        {
            id: 'btn_1',
            name: 'Copy Link Shopee',
            content: "https://shope.ee/affiliate1\nhttps://shope.ee/affiliate2\nhttps://shope.ee/affiliate3\nhttps://shope.ee/affiliate4",
            selectorMode: 'ROTATOR',
            actionMode: 'COPY',
            cutMode: false,
            currentIndex: 0,
            colorIndex: 0
        },
        {
            id: 'btn_2',
            name: 'Copy Voucher Diskon',
            content: "DISKON50RB\nGRATISONGKIR\nCASHBACK10",
            selectorMode: 'SINGLE',
            actionMode: 'COPY',
            cutMode: false,
            currentIndex: 0,
            colorIndex: 1
        },
        {
            id: 'btn_3',
            name: 'Buka Live Stream',
            content: "https://live.shopee.co.id/share?from=live\nhttps://shopee.co.id/flash-sale",
            selectorMode: 'ROTATOR',
            actionMode: 'OPEN',
            cutMode: false,
            currentIndex: 0,
            colorIndex: 2
        },
        {
            id: 'btn_4',
            name: 'Copy Caption Promo',
            content: "🔥 PROMO SPESIAL HARI INI! Cek keranjang sekarang sebelum kehabisan voucher diskon 50%! Link di bio ya kak ✨",
            selectorMode: 'SINGLE',
            actionMode: 'COPY',
            cutMode: false,
            currentIndex: 0,
            colorIndex: 3
        }
    ];

    let buttons = [];

    // Inisialisasi Aplikasi
    function init() {
        loadButtons();
        renderButtons();
        renderColorPicker();

        // Listener tombol Escape untuk menutup modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeEditModal();
        });
    }

    // Load data tombol dari LocalStorage
    function loadButtons() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                buttons = JSON.parse(raw);
            } else {
                buttons = [...DEFAULT_BUTTONS];
                saveToStorage();
            }
        } catch (e) {
            console.error('Error loading buttons:', e);
            buttons = [...DEFAULT_BUTTONS];
        }
    }

    // Simpan data tombol ke LocalStorage
    function saveToStorage() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(buttons));
        } catch (e) {
            console.error('Error saving buttons:', e);
        }
    }

    // Memecah teks textarea menjadi array per baris
    function getLines(content) {
        if (!content) return [];
        return content.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    }

    // Render daftar seluruh paket tombol
    function renderButtons() {
        const container = document.getElementById('button-list');
        const emptyState = document.getElementById('empty-state');
        container.innerHTML = '';

        if (!buttons || buttons.length === 0) {
            emptyState.classList.remove('hidden');
            return;
        }
        emptyState.classList.add('hidden');

        buttons.forEach((btn) => {
            const lines = getLines(btn.content);
            const count = lines.length;
            const color = COLOR_PALETTE[btn.colorIndex % COLOR_PALETTE.length];
            
            // Icon aksi
            const actionIcon = btn.actionMode === 'OPEN' 
                ? '<i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-90"></i>' 
                : '<i class="fa-regular fa-copy text-xs opacity-90"></i>';

            // Badge kecil indikator ROTATOR
            const modeBadge = btn.selectorMode === 'ROTATOR' 
                ? '<span class="text-[10px] bg-black/20 text-white/90 px-1.5 py-0.5 rounded font-mono">ROT</span>' 
                : '';

            const row = document.createElement('div');
            row.className = 'flex items-stretch gap-2 w-full';
            row.innerHTML = `
                <!-- TOMBOL SEBELAH KIRI: EDIT -->
                <button onclick="openEditModal('${btn.id}')" 
                    class="btn-press bg-slate-700 hover:bg-slate-800 text-white font-bold text-xs px-3 py-3 rounded-lg flex items-center justify-center gap-1.5 shadow-sm border border-slate-800/20 shrink-0 w-[84px]">
                    <i class="fa-solid fa-pen-to-square text-xs text-amber-300"></i>
                    <span>EDIT</span>
                </button>

                <!-- TOMBOL SEBELAH KANAN: EKSEKUSI -->
                <button onclick="executeButtonAction('${btn.id}')" 
                    style="background-color: ${color.bg}; box-shadow: 0 3px 8px ${color.shadow};"
                    class="btn-press flex-1 text-white font-bold text-xs sm:text-sm px-3 py-3 rounded-lg flex items-center justify-between gap-2 border border-white/10 overflow-hidden active:brightness-95">
                    <span class="flex items-center gap-2 truncate text-left">
                        ${actionIcon}
                        <span class="truncate">${escapeHtml(btn.name)}</span>
                        ${modeBadge}
                    </span>
                    <span class="bg-black/25 text-white text-[11px] font-mono px-2 py-0.5 rounded-full shrink-0">
                        ${count}
                    </span>
                </button>
            `;
            container.appendChild(row);
        });
    }

    // Render Color Picker di Modal
    function renderColorPicker(selectedIdx = 0) {
        const container = document.getElementById('color-picker-container');
        if (!container) return;
        container.innerHTML = '';

        COLOR_PALETTE.forEach((col, idx) => {
            const isSelected = idx === selectedIdx;
            const swatch = document.createElement('div');
            swatch.className = `w-6 h-6 rounded-full cursor-pointer transition transform hover:scale-110 flex items-center justify-center border-2 ${isSelected ? 'border-indigo-600 scale-110 shadow-md' : 'border-white'}`;
            swatch.style.backgroundColor = col.bg;
            swatch.title = col.name;
            if (isSelected) {
                swatch.innerHTML = '<i class="fa-solid fa-check text-white text-[10px]"></i>';
            }
            swatch.onclick = () => {
                document.getElementById('edit-btn-color-index').value = idx;
                renderColorPicker(idx);
            };
            container.appendChild(swatch);
        });
    }

    // Eksekusi klik tombol aksi sebelah kanan
    function executeButtonAction(id) {
        const btn = buttons.find(b => b.id === id);
        if (!btn) return;

        let lines = getLines(btn.content);
        if (lines.length === 0) {
            showToast('Daftar teks/link kosong! Klik EDIT untuk mengisi.', 'error');
            return;
        }

        let selectedText = '';
        let targetIndex = 0;
        let itemNumber = 1;
        const totalItems = lines.length;

        if (btn.selectorMode === 'ROTATOR') {
            // Mode Rotator: berurutan
            if (btn.currentIndex === undefined || btn.currentIndex >= lines.length) {
                btn.currentIndex = 0;
            }
            targetIndex = btn.currentIndex;
            selectedText = lines[targetIndex];
            itemNumber = targetIndex + 1;

            if (btn.cutMode) {
                // Mode Cut: hapus baris yang telah diambil
                lines.splice(targetIndex, 1);
                btn.content = lines.join('\n');
                if (btn.currentIndex >= lines.length) {
                    btn.currentIndex = 0;
                }
            } else {
                // Rotasi index ke item berikutnya
                btn.currentIndex = (btn.currentIndex + 1) % lines.length;
            }
        } else {
            // Mode Single: selalu ambil baris paling atas / pertama
            targetIndex = 0;
            selectedText = lines[0];
            itemNumber = 1;

            if (btn.cutMode) {
                // Mode Cut: hapus baris paling atas
                lines.shift();
                btn.content = lines.join('\n');
                btn.currentIndex = 0;
            }
        }

        saveToStorage();
        renderButtons();

        // Eksekusi aksi
        if (btn.actionMode === 'COPY') {
            performCopy(selectedText, btn.name, itemNumber, totalItems, btn.cutMode);
        } else if (btn.actionMode === 'OPEN') {
            performOpen(selectedText, btn.name, itemNumber, totalItems, btn.cutMode);
        }
    }

    // Fungsi Salin ke Clipboard
    function performCopy(text, btnName, itemNo, total, isCut) {
        const info = `(${itemNo}/${total}${isCut ? ' - Cut' : ''})`;

        // Cek AndroidBridge
        if (window.AndroidBridge && typeof window.AndroidBridge.copyToClipboard === 'function') {
            window.AndroidBridge.copyToClipboard(text);
            showToast(`[${btnName}] Tersalin ${info}: ${previewText(text)}`, 'success');
            return;
        }

        // Standard Web Clipboard API
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`[${btnName}] Tersalin ${info}: ${previewText(text)}`, 'success');
            }).catch(() => {
                fallbackCopy(text, btnName, info);
            });
        } else {
            fallbackCopy(text, btnName, info);
        }
    }

    // Fallback Clipboard jika clipboard API tidak diizinkan
    function fallbackCopy(text, btnName, info) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
            document.execCommand('copy');
            showToast(`[${btnName}] Tersalin ${info}: ${previewText(text)}`, 'success');
        } catch (e) {
            showToast('Gagal menyalin teks.', 'error');
        }
        document.body.removeChild(ta);
    }

    // Fungsi Buka di Browser Eksternal
    function performOpen(url, btnName, itemNo, total, isCut) {
        let cleanUrl = url.trim();
        if (!/^https?:\/\//i.test(cleanUrl)) {
            cleanUrl = 'https://' + cleanUrl;
        }

        const info = `(${itemNo}/${total}${isCut ? ' - Cut' : ''})`;
        showToast(`[${btnName}] Membuka link ${info}...`, 'info');

        // Panggil AndroidBridge jika tersedia di WebView Android
        if (window.AndroidBridge && typeof window.AndroidBridge.openExternal === 'function') {
            window.AndroidBridge.openExternal(cleanUrl);
            return;
        }

        // Default browser window.open
        window.open(cleanUrl, '_blank');
    }

    // Buka Modal Edit
    function openEditModal(id) {
        const btn = buttons.find(b => b.id === id);
        if (!btn) return;

        document.getElementById('edit-btn-id').value = btn.id;
        document.getElementById('edit-btn-name').value = btn.name || '';
        document.getElementById('edit-btn-content').value = btn.content || '';
        document.getElementById('edit-btn-selector-mode').value = btn.selectorMode || 'ROTATOR';
        document.getElementById('edit-btn-action-mode').value = btn.actionMode || 'COPY';
        document.getElementById('edit-btn-cut-mode').checked = !!btn.cutMode;
        
        const colorIdx = btn.colorIndex !== undefined ? btn.colorIndex : 0;
        document.getElementById('edit-btn-color-index').value = colorIdx;
        renderColorPicker(colorIdx);

        updateContentLineCount();

        const modal = document.getElementById('edit-modal');
        modal.classList.remove('hidden');
        setTimeout(() => {
            modal.querySelector('.modal-content').classList.remove('scale-95');
            modal.querySelector('.modal-content').classList.add('scale-100');
        }, 10);
    }

    // Tutup Modal Edit
    function closeEditModal() {
        const modal = document.getElementById('edit-modal');
        modal.querySelector('.modal-content').classList.remove('scale-100');
        modal.querySelector('.modal-content').classList.add('scale-95');
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 150);
    }

    // Hitung jumlah baris teks di textarea
    function updateContentLineCount() {
        const val = document.getElementById('edit-btn-content').value;
        const count = getLines(val).length;
        document.getElementById('content-line-count').innerText = `${count} baris`;
    }

    // Simpan Pengaturan Tombol dari Modal
    function saveButtonSettings(e) {
        e.preventDefault();
        const id = document.getElementById('edit-btn-id').value;
        const btn = buttons.find(b => b.id === id);
        if (!btn) return;

        btn.name = document.getElementById('edit-btn-name').value.trim();
        btn.content = document.getElementById('edit-btn-content').value;
        btn.selectorMode = document.getElementById('edit-btn-selector-mode').value;
        btn.actionMode = document.getElementById('edit-btn-action-mode').value;
        btn.cutMode = document.getElementById('edit-btn-cut-mode').checked;
        btn.colorIndex = parseInt(document.getElementById('edit-btn-color-index').value) || 0;
        btn.currentIndex = 0; // reset index rotasi saat diedit

        saveToStorage();
        renderButtons();
        closeEditModal();
        showToast('Pengaturan tombol berhasil disimpan!', 'success');
    }

    // Hapus Paket Tombol
    function deleteCurrentButtonPackage() {
        const id = document.getElementById('edit-btn-id').value;
        if (!confirm('Apakah Anda yakin ingin menghapus paket tombol ini?')) return;

        buttons = buttons.filter(b => b.id !== id);
        saveToStorage();
        renderButtons();
        closeEditModal();
        showToast('Paket tombol telah dihapus.', 'info');
    }

    // Tambah Paket Tombol Baru dengan (+) di pojok kiri bawah
    function addNewButtonPackage() {
        const newIndex = buttons.length;
        // Warna selalu berbeda dari tombol sebelumnya dengan siklus COLOR_PALETTE
        const lastColorIndex = buttons.length > 0 ? buttons[buttons.length - 1].colorIndex : -1;
        const nextColorIndex = (lastColorIndex + 1) % COLOR_PALETTE.length;

        const newBtn = {
            id: 'btn_' + Date.now(),
            name: `Tombol Baru ${newIndex + 1}`,
            content: '',
            selectorMode: 'ROTATOR',
            actionMode: 'COPY',
            cutMode: false,
            currentIndex: 0,
            colorIndex: nextColorIndex
        };

        buttons.push(newBtn);
        saveToStorage();
        renderButtons();

        // Langsung buka modal edit untuk mengonfigurasi tombol baru
        openEditModal(newBtn.id);
        showToast('Paket tombol baru ditambahkan. Silakan atur fungsinya.', 'info');
    }

    // Tampilkan Toast
    let toastTimeout;
    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        const icon = document.getElementById('toast-icon');
        const text = document.getElementById('toast-message');

        clearTimeout(toastTimeout);

        if (type === 'success') {
            icon.className = 'fa-solid fa-circle-check text-emerald-400 text-sm';
        } else if (type === 'error') {
            icon.className = 'fa-solid fa-circle-exclamation text-rose-400 text-sm';
        } else {
            icon.className = 'fa-solid fa-circle-info text-sky-400 text-sm';
        }

        text.innerText = msg;
        toast.classList.add('show');

        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 2600);
    }

    // Helper preview teks singkat
    function previewText(str) {
        if (!str) return '';
        return str.length > 32 ? str.substring(0, 32) + '...' : str;
    }

    // Helper escape html
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;');
    }

    // Inisialisasi saat DOM siap
    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
