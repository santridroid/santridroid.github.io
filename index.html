<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANTRIDROID - Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        
        @keyframes gradientBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #0a0a0a, #1a1a1a, #0d1a14, #050505);
            background-size: 400% 400%;
            animation: gradientBackground 10s ease infinite;
            display: flex; flex-direction: column; align-items: center;
            color: #ffffff;
        }

        /* --- STYLED LOGO SANTRIDROID --- */
        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            letter-spacing: 6px;
            color: #3DDC84; 
            text-shadow: 0 0 15px rgba(61, 220, 132, 0.6);
            margin: 25px 0;
            text-transform: uppercase;
        }

        /* --- TOOLBAR --- */
        .toolbar {
            width: 100%; background: rgba(0, 0, 0, 0.9);
            padding: 10px 20px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 2px solid #3DDC84;
        }

        .nav-links { display: flex; align-items: center; gap: 5px; }
        .nav-item {
            text-decoration: none; color: #888; 
            display: flex; align-items: center; justify-content: center;
            width: 45px; height: 45px; border-radius: 12px; transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active { color: #3DDC84; background: rgba(61, 220, 132, 0.1); }
        .nav-divider { width: 1px; height: 20px; background: #333; margin: 0 5px; }

        /* --- AUTH & ADMIN --- */
        .btn-login-toggle { background:transparent; color:#3DDC84; border:1px solid #3DDC84; padding:8px 16px; border-radius:20px; cursor:pointer; font-weight:bold; }
        .login-popup {
            display: none; position: absolute; top: 60px; right: 20px;
            background: #111; padding: 20px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,1); width: 260px; 
            flex-direction: column; gap: 12px; z-index: 1001; border: 1px solid #333;
        }
        .login-popup input { padding: 12px; border: 1px solid #333; border-radius: 8px; background: #000; color: white; }
        
        #admin-panel {
            background: #111; padding: 25px; border-radius: 20px; margin: 20px 0;
            width: 90%; max-width: 600px; display: none; border: 1px dashed #3DDC84;
        }
        .admin-input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #333; border-radius: 10px; background: #000; color: white; }
        .btn-add { background: #3DDC84; color: #000; border: none; padding: 14px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: 900; font-family: 'Orbitron'; }

        /* --- CONTENT --- */
        .container {
            flex: 1; width: 95%; max-width: 800px; text-align: center;
            padding: 20px 0; margin-bottom: 50px;
        }
        .menu-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 10px; }
        
        .menu-wrapper { 
            position: relative; flex: 1 1 calc(50% - 20px); min-width: 160px; 
            border-radius: 18px; overflow: hidden; transition: 0.3s;
            display: flex;
        }
        
        /* GAYA TEXT BOX LINK (Update: Lebih Besar & Rata Tengah) */
        .menu-item {
            display: flex; 
            align-items: center; 
            justify-content: center; /* Rata tengah horizontal */
            text-align: center;      /* Rata tengah teks */
            width: 100%; 
            min-height: 100px; 
            padding: 20px 50px;      /* Memberi ruang untuk icon download */
            text-decoration: none; 
            color: #000; 
            font-weight: 900;
            transition: 0.3s; 
            font-size: 1.75em;        /* Ukuran 1,5x lipat lebih besar */
            text-transform: uppercase; 
            letter-spacing: 1px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
            line-height: 1.2;
        }
        .menu-item:hover { transform: translateY(-5px) scale(1.02); filter: brightness(1.2); }

        .download-zone {
            position: absolute; right: 0; top: 0; bottom: 0;
            width: 50px; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.1); color: #000; transition: 0.3s;
            font-size: 1.4em; border-left: 1px solid rgba(0,0,0,0.05);
        }
        .download-zone:hover { background: rgba(0,0,0,0.2); }

        .admin-controls { position: absolute; top: 8px; left: 8px; display: flex; gap: 5px; }
        .btn-ctrl {
            background: rgba(0,0,0,0.4); color: white; border: none;
            width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 10px;
        }

        footer { padding: 30px; color: #444; font-family: 'Orbitron'; font-size: 0.7em; letter-spacing: 3px; }

        .badge-new { 
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            background: #000; color: #fff; font-size: 9px; 
            padding: 2px 12px; border-radius: 0 0 10px 10px; font-weight: 900; z-index: 2;
        }

        @media (max-width: 480px) { 
            .menu-wrapper { flex: 1 1 100%; }
            .menu-item { font-size: 1.4em; } /* Penyesuaian sedikit untuk layar kecil agar tidak overflow */
        }
    </style>
</head>
<body>

    <nav class="toolbar">
        <div class="nav-links">
            <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i></a>
            <div class="nav-divider"></div>
            <a href="#" class="nav-item"><i class="fa-solid fa-layer-group"></i></a>
            <div class="nav-divider"></div>
            <a href="#" class="nav-item"><i class="fa-solid fa-robot"></i></a>
        </div>
        
        <div class="auth-container" id="auth-wrapper">
            <button class="btn-login-toggle" onclick="toggleLoginForm(event)"><i class="fa-solid fa-key"></i> ADMIN</button>
            <div class="login-popup" id="login-popup">
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Password">
                <label style="display:flex; align-items:center; gap:8px; font-size:12px; color:#666">
                    <input type="checkbox" id="rememberMe"> Simpan Sesi
                </label>
                <button class="btn-add" onclick="login()">LOGIN</button>
            </div>
            <button id="btn-logout" style="display:none; background: #ff4757; color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer; font-weight:bold" onclick="logout()">LOGOUT</button>
        </div>
    </nav>

    <div class="brand-logo">SANTRIDROID</div>

    <div id="admin-panel">
        <h3 style="margin-bottom:15px; font-family:'Orbitron'; color:#3DDC84">COMMAND CENTER</h3>
        <input type="text" id="title" class="admin-input" placeholder="Nama Menu">
        <input type="text" id="url" class="admin-input" placeholder="URL Link">
        <input type="text" id="downloadUrl" class="admin-input" placeholder="URL Download (Opsional)">
        <button class="btn-add" onclick="addMenu()">PUBLISH</button>
    </div>

    <div class="container">
        <div id="menu-container" class="menu-list"></div>
    </div>

    <footer>
        SANTRIDROID SYSTEM &copy; 2026
    </footer>

    <script>
        // --- FIREBASE CONFIG SANTRIDROID-LINK ---
        const firebaseConfig = {
            apiKey: "AIzaSyBuquQlJWdSUuHhmJBxBGa1LNzWUdFNdzE",
            authDomain: "santridroid-link.firebaseapp.com",
            databaseURL: "https://santridroid-link-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "santridroid-link",
            storageBucket: "santridroid-link.firebasestorage.app",
            messagingSenderId: "37630509146",
            appId: "1:37630509146:web:e1472cff08b34269721863",
            measurementId: "G-6YM0LDQTHN"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let isAdmin = false;
        let editingKey = null;
        let menuDataCache = {};

        // Palet Warna Neon Cyberpunk
        const neonColors = [
            { bg: '#3DDC84', glow: 'rgba(61, 220, 132, 0.7)' },
            { bg: '#00E5FF', glow: 'rgba(0, 229, 255, 0.7)' },
            { bg: '#FF00E5', glow: 'rgba(255, 0, 229, 0.7)' },
            { bg: '#FFFF00', glow: 'rgba(255, 255, 0, 0.7)' },
            { bg: '#FF3D00', glow: 'rgba(255, 61, 0, 0.7)' },
            { bg: '#7C4DFF', glow: 'rgba(124, 77, 255, 0.7)' },
            { bg: '#00FF94', glow: 'rgba(0, 255, 148, 0.7)' },
            { bg: '#FF1744', glow: 'rgba(255, 23, 68, 0.7)' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('sd_email');
            const savedPass = localStorage.getItem('sd_pass');
            if (savedEmail && savedPass) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('password').value = savedPass;
                document.getElementById('rememberMe').checked = true;
            }
        });

        function toggleLoginForm(event) {
            event.stopPropagation();
            const popup = document.getElementById('login-popup');
            popup.style.display = (popup.style.display === 'flex') ? 'none' : 'flex';
        }

        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, pass)
            .then(() => {
                if(document.getElementById('rememberMe').checked) {
                    localStorage.setItem('sd_email', email);
                    localStorage.setItem('sd_pass', pass);
                }
                document.getElementById('login-popup').style.display = 'none';
            }).catch((err) => alert("Error: " + err.message));
        }

        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            isAdmin = !!user;
            document.getElementById('admin-panel').style.display = isAdmin ? 'block' : 'none';
            document.getElementById('btn-logout').style.display = isAdmin ? 'block' : 'none';
            document.querySelector('.btn-login-toggle').style.display = isAdmin ? 'none' : 'block';
            renderMenus(); 
        });

        function addMenu() {
            const title = document.getElementById('title').value;
            const url = document.getElementById('url').value;
            const dl = document.getElementById('downloadUrl').value;
            if(title && url) {
                db.ref('ubaid').push({
                    title, 
                    url: url.startsWith('http') ? url : 'https://' + url,
                    downloadUrl: dl ? (dl.startsWith('http') ? dl : 'https://' + dl) : "",
                    createdAt: new Date().toISOString().split('T')[0]
                }).then(() => {
                    document.getElementById('title').value = "";
                    document.getElementById('url').value = "";
                    document.getElementById('downloadUrl').value = "";
                });
            }
        }

        db.ref('ubaid').on('value', (snap) => {
            menuDataCache = snap.val() || {};
            renderMenus();
        });

        function renderMenus() {
            const container = document.getElementById('menu-container');
            container.innerHTML = "";
            
            let colorIndex = 0;
            for (let key in menuDataCache) {
                const data = menuDataCache[key];
                const isNew = Math.ceil(Math.abs(new Date() - new Date(data.createdAt)) / (1000 * 60 * 60 * 24)) <= 3;
                const theme = neonColors[colorIndex % neonColors.length];
                
                const wrapper = document.createElement('div');
                wrapper.className = 'menu-wrapper';
                wrapper.style.boxShadow = `0 0 20px ${theme.glow}`;

                if (isAdmin && editingKey === key) {
                    wrapper.innerHTML = `
                        <div style="background:#222; padding:15px; border:2px solid ${theme.bg}; width:100%">
                            <input type="text" id="ed-t-${key}" class="admin-input" value="${data.title}">
                            <div style="display:flex; gap:5px;">
                                <button class="btn-add" style="font-size:10px; padding:8px" onclick="saveEdit('${key}')">SAVE</button>
                                <button class="btn-add" style="background:#444; color:#fff; font-size:10px; padding:8px" onclick="editingKey=null;renderMenus()">X</button>
                            </div>
                        </div>`;
                } else {
                    wrapper.innerHTML = `
                        ${isNew ? '<div class="badge-new">NEW UPDATE</div>' : ''}
                        <a href="${data.url}" target="_blank" class="menu-item" style="background: ${theme.bg};">
                            <span>${data.title}</span>
                        </a>
                        ${data.downloadUrl ? `<a href="${data.downloadUrl}" target="_blank" class="download-zone"><i class="fa-solid fa-download"></i></a>` : ''}
                        ${isAdmin ? `
                        <div class="admin-controls">
                            <button class="btn-ctrl" onclick="editingKey='${key}';renderMenus()"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-ctrl" style="color:#ff4757" onclick="deleteMenu('${key}')"><i class="fa-solid fa-trash"></i></button>
                        </div>` : ''}`;
                }
                container.appendChild(wrapper);
                colorIndex++;
            }
        }

        function saveEdit(key) {
            const title = document.getElementById(`ed-t-${key}`).value;
            if(title) {
                db.ref('ubaid/' + key).update({ title }).then(() => {
                    editingKey = null;
                    renderMenus();
                });
            }
        }

        function deleteMenu(key) { if(confirm("Hapus data?")) db.ref('ubaid/' + key).remove(); }
    </script>
</body>
</html>
