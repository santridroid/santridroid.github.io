<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANTRIDROID - Notes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        @keyframes gradientBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #a1c4fd, #c2e9fb, #d4fc79, #96e6a1, #84fab0, #8fd3f4);
            background-size: 300% 300%;
            animation: gradientBackground 15s ease infinite;
            display: flex; flex-direction: column; align-items: center;
            padding-bottom: 100px;
        }

        /* --- TOOLBAR --- */
        .toolbar {
            width: 100%; background: rgba(255, 255, 255, 0.95);
            padding: 8px 15px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            position: sticky; top: 0; z-index: 1000;
        }
        .nav-links { display: flex; align-items: center; gap: 0; }
        .nav-item {
            text-decoration: none; color: #555; 
            display: flex; align-items: center; justify-content: center;
            width: 45px; height: 45px; border-radius: 12px; transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active { color: #2ecc71; background: rgba(46, 204, 113, 0.1); }
        .nav-divider { width: 1.5px; height: 22px; background: #e0e0e0; margin: 0 4px; }

        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900; font-size: 1.8rem; letter-spacing: 4px;
            color: #2ecc71; text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            margin: 20px 0; text-transform: uppercase;
        }

        /* --- TABS --- */
        .tab-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            background: rgba(255,255,255,0.7); border: none; padding: 10px 20px;
            border-radius: 50px; cursor: pointer; font-weight: bold; color: #555; transition: 0.3s;
        }
        .tab-btn.active { background: #2ecc71; color: white; }

        /* --- GRID --- */
        .container {
            flex: 1; width: 95%; max-width: 900px;
            background: rgba(255, 255, 255, 0.85); border-radius: 25px;
            padding: 25px 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        
        .note-card {
            background: white; padding: 15px; border-radius: 18px; color: #333;
            text-align: left; cursor: pointer; transition: 0.3s; height: 120px;
            display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.03);
            position: relative;
        }
        .note-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .note-title { font-weight: 800; font-size: 0.95rem; color: #2c3e50; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .note-preview { font-size: 0.8rem; color: #777; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }

        /* --- FAB --- */
        .fab {
            position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px;
            background: #2ecc71; color: white; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 22px;
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.3); cursor: pointer; border: none; z-index: 1500;
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(6px);
        }
        .modal-content { 
            background: white; padding: 25px; border-radius: 20px; width: 90%; 
            max-width: 400px; box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        .admin-input { 
            width: 100%; padding: 12px; margin-bottom: 12px; 
            border: 1.5px solid #f0f0f0; border-radius: 12px; outline: none;
        }
        textarea.admin-input { min-height: 150px; resize: none; font-family: monospace; }
        
        .btn-group { display: flex; gap: 8px; }
        .btn-save { background: #2ecc71; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; flex: 2; font-weight: bold; }
        .btn-cancel { background: #eee; color: #666; border: none; padding: 12px; border-radius: 10px; cursor: pointer; flex: 1; }

        .admin-controls { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 4px; }
        .btn-ctrl { background: #f8f9fa; color: #999; border: none; width: 25px; height: 25px; border-radius: 6px; cursor: pointer; font-size: 10px; }
        .btn-ctrl:hover { background: #ff4757; color: white; }

        footer { width: 100%; padding: 20px; text-align: center; color: #666; font-family: 'Orbitron'; font-size: 0.6rem; letter-spacing: 2px; }
    </style>
</head>
<body>

    <nav class="toolbar">
        <div class="nav-links">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i></a>
            <div class="nav-divider"></div>
            <a href="note.html" class="nav-item active"><i class="fa-solid fa-layer-group"></i></a>
            <div class="nav-divider"></div>
            <a href="#" class="nav-item"><i class="fa-solid fa-cloud"></i></a>
        </div>
        <div style="position: relative;">
            <button id="btn-login-trigger" onclick="toggleLogin()" style="background:none; border:1px solid #ddd; padding:6px 12px; border-radius:15px; font-size: 0.8rem; cursor:pointer"><i class="fa-solid fa-user-lock"></i> Login</button>
            <div id="login-popup" style="display:none; position:absolute; top:40px; right:0; background:white; padding:15px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.1); width:200px; z-index:1001;">
                <input type="email" id="email" class="admin-input" placeholder="Email" style="font-size: 0.8rem;">
                <input type="password" id="password" class="admin-input" placeholder="Pass" style="font-size: 0.8rem;">
                <button class="btn-save" onclick="login()" style="padding:8px">Masuk</button>
            </div>
            <button id="btn-logout" style="display:none; background:#ff4757; color:white; border:none; padding:6px 12px; border-radius:15px; font-size: 0.8rem;" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="brand-logo">SANTRIDROID</div>

    <div class="tab-container">
        <button id="tab-pub" class="tab-btn active" onclick="switchTab('public')">PUBLIK</button>
        <button id="tab-priv" class="tab-btn" style="display:none;" onclick="switchTab('private')">PRIVAT 🔒</button>
    </div>

    <div class="container">
        <div id="notes-grid" class="notes-grid"></div>
    </div>

    <button class="fab" onclick="openFormModal()"><i class="fas fa-plus"></i></button>

    <div id="form-modal" class="modal-overlay" onclick="closeModal('form-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modal-title" style="margin-bottom:15px;">Catatan Baru</h3>
            <input type="text" id="note-title-input" class="admin-input" placeholder="Judul...">
            <textarea id="note-content-input" class="admin-input" placeholder="Isi catatan atau script..."></textarea>
            <div class="btn-group">
                <button class="btn-cancel" onclick="closeModal('form-modal')">Batal</button>
                <button class="btn-save" onclick="handleSave()">Simpan</button>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="modal-overlay" onclick="closeModal('detail-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="view-title" style="margin-bottom:10px; color:#2ecc71;"></h3>
            <textarea id="view-content" class="admin-input" style="height:200px; background:#f9f9f9; border:none;" readonly></textarea>
            <div class="btn-group">
                <button class="btn-cancel" onclick="closeModal('detail-modal')">Tutup</button>
                <button class="btn-save" style="background:#3498db" onclick="copyText()"><i class="fas fa-copy"></i> Salin</button>
            </div>
        </div>
    </div>

    <footer>&copy; 2026 SANTRIDROID • ALL RIGHTS RESERVED</footer>

    <script>
        // Gunakan Config Anda
        const firebaseConfig = {
            apiKey: "AIzaSyBuquQlJWdSUuHhmJBxBGa1LNzWUdFNdzE",
            authDomain: "santridroid-link.firebaseapp.com",
            databaseURL: "https://santridroid-link-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "santridroid-link",
            storageBucket: "santridroid-link.firebasestorage.app",
            messagingSenderId: "37630509146",
            appId: "1:37630509146:web:e1472cff08b34269721863"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let currentTab = 'public';
        let isAdmin = false;
        let editKey = null;

        function toggleLogin() {
            const p = document.getElementById('login-popup');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
        }

        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(e, p).then(() => {
                document.getElementById('login-popup').style.display = 'none';
            }).catch(a => alert("Error: " + a.message));
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        auth.onAuthStateChanged(user => {
            isAdmin = !!user;
            document.getElementById('btn-logout').style.display = isAdmin ? 'block' : 'none';
            document.getElementById('btn-login-trigger').style.display = isAdmin ? 'none' : 'block';
            document.getElementById('tab-priv').style.display = isAdmin ? 'block' : 'none';
            initSync();
        });

        function switchTab(t) {
            currentTab = t;
            document.getElementById('tab-pub').classList.toggle('active', t === 'public');
            document.getElementById('tab-priv').classList.toggle('active', t === 'private');
            initSync();
        }

        function initSync() {
            const grid = document.getElementById('notes-grid');
            const path = (currentTab === 'private' && isAdmin) ? `notes/private/${auth.currentUser.uid}` : 'notes/public';
            
            db.ref(path).off();
            db.ref(path).on('value', snap => {
                grid.innerHTML = '';
                snap.forEach(child => {
                    const d = child.val();
                    const k = child.key;
                    const card = document.createElement('div');
                    card.className = 'note-card';
                    card.onclick = () => openDetail(d.title, d.content);
                    card.innerHTML = `
                        <div class="note-title">${d.title}</div>
                        <div class="note-preview">${d.content}</div>
                        ${isAdmin ? `
                        <div class="admin-controls">
                            <button class="btn-ctrl" onclick="event.stopPropagation(); openEdit('${k}', '${d.title}', '${d.content.replace(/\n/g, '\\n')}')"><i class="fas fa-pen"></i></button>
                            <button class="btn-ctrl" onclick="event.stopPropagation(); delNote('${k}')"><i class="fas fa-trash"></i></button>
                        </div>` : ''}
                    `;
                    grid.prepend(card);
                });
            });
        }

        function openFormModal() {
            editKey = null;
            document.getElementById('modal-title').innerText = "Catatan Baru";
            document.getElementById('note-title-input').value = "";
            document.getElementById('note-content-input').value = "";
            document.getElementById('form-modal').style.display = 'flex';
        }

        function openEdit(k, t, c) {
            editKey = k;
            document.getElementById('modal-title').innerText = "Edit Catatan";
            document.getElementById('note-title-input').value = t;
            document.getElementById('note-content-input').value = c.replace(/\\n/g, '\n');
            document.getElementById('form-modal').style.display = 'flex';
        }

        function handleSave() {
            const t = document.getElementById('note-title-input').value;
            const c = document.getElementById('note-content-input').value;
            if(!t || !c) return alert("Isi semua!");

            const path = (isAdmin && currentTab === 'private') ? `notes/private/${auth.currentUser.uid}` : 'notes/public';
            const data = { title: t, content: c, time: Date.now() };

            const p = editKey ? db.ref(`${path}/${editKey}`).update(data) : db.ref(path).push(data);
            p.then(() => {
                closeModal('form-modal');
                if(!isAdmin) alert("Terkirim!");
            });
        }

        function delNote(k) {
            if(confirm("Hapus?")) {
                const path = (currentTab === 'private') ? `notes/private/${auth.currentUser.uid}` : 'notes/public';
                db.ref(`${path}/${k}`).remove();
            }
        }

        function openDetail(t, c) {
            document.getElementById('view-title').innerText = t;
            document.getElementById('view-content').value = c;
            document.getElementById('detail-modal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function copyText() {
            const c = document.getElementById('view-content');
            c.select();
            document.execCommand('copy');
            alert("Disalin!");
        }

        window.onclick = (e) => {
            if (e.target.id === 'form-modal' || e.target.id === 'detail-modal') {
                e.target.style.display = 'none';
            }
        };
    </script>
</body>
</html>
