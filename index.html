<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muzans Developer - Ubaid Edition</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Roboto,sans-serif
}

body{
min-height:100vh;
background:linear-gradient(120deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1,#84fab0,#8fd3f4);
background-size:300% 300%;
animation:bg 15s ease infinite;
display:flex;
flex-direction:column;
align-items:center
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* toolbar */

.toolbar{
width:100%;
background:#fff;
padding:10px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.1)
}

.nav-item{
width:42px;
height:42px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
color:#555;
text-decoration:none;
transition:.2s
}

.nav-item:hover{
background:#ffeaea;
color:#ff6b6b
}

/* container */

.container{
width:95%;
max-width:700px;
margin:30px 0;
background:rgba(255,255,255,.9);
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.1)
}

.menu-list{
display:flex;
flex-wrap:wrap;
gap:16px;
justify-content:center
}

.menu-item{
flex:1 1 calc(50% - 16px);
min-width:160px;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
border-radius:16px;
color:#fff;
font-weight:600;
text-decoration:none;
transition:.25s
}

.menu-item:hover{
transform:translateY(-4px)
}

.download{
margin-left:10px;
font-size:18px
}

footer{
margin-top:auto;
padding:20px;
color:#555
}

@media(max-width:480px){
.menu-item{flex:1 1 100%}
}

</style>
</head>

<body>

<nav class="toolbar">

<a href="#" class="nav-item">
<i class="fa-solid fa-house"></i>
</a>

<a href="https://santridroid.github.io/note.html" class="nav-item">
<i class="fa-solid fa-sticky-note"></i>
</a>

</nav>

<div class="container">

<div id="menu" class="menu-list">
Loading...
</div>

</div>

<footer>
© 2026 Muzans Developer
</footer>

<script>

const firebaseConfig={
apiKey:"AIzaSyBuquQlJWdSUuHhmJBxBGa1LNzWUdFNdzE",
authDomain:"santridroid-link.firebaseapp.com",
databaseURL:"https://santridroid-link-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"santridroid-link",
storageBucket:"santridroid-link.firebasestorage.app",
messagingSenderId:"37630509146",
appId:"1:37630509146:web:e1472cff08b34269721863"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

const container=document.getElementById("menu");

const colors=[
"#ff6b6b",
"#54a0ff",
"#5f27cd",
"#ff9f43",
"#1dd1a1",
"#00d2d3",
"#f368e0",
"#10ac84"
];

db.ref("ubaid").on("value",snap=>{

const data=snap.val();

container.innerHTML="";

if(!data){
container.innerHTML="Belum ada menu";
return;
}

const frag=document.createDocumentFragment();

let i=0;

for(const key in data){

const item=data[key];

const a=document.createElement("a");

a.className="menu-item";

a.href=item.url;

a.style.background=colors[i%colors.length];

a.innerHTML=`
<span>${item.title}</span>
${item.downloadUrl?`<i class="fa-solid fa-circle-arrow-down download"></i>`:""}
`;

frag.appendChild(a);

i++;

}

container.appendChild(frag);

});

</script>

</body>
</html>
