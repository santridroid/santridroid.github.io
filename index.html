<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANTRIDROID - Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        
        @keyframes gradientBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #121212, #1e1e1e, #0f3d2e, #0a2e1f);
            background-size: 400% 400%;
            animation: gradientBackground 10s ease infinite;
            display: flex; flex-direction: column; align-items: center;
            color: #ffffff;
        }

        /* --- STYLED LOGO SANTRIDROID --- */
        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            letter-spacing: 6px;
            color: #3DDC84; /* Warna Hijau Android */
            text-shadow: 0 0 15px rgba(61, 220, 132, 0.4);
            margin: 20px 0;
            text-transform: uppercase;
        }

        /* --- TOOLBAR --- */
        .toolbar {
            width: 100%; background: rgba(25, 25, 25, 0.95);
            padding: 10px 20px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 2px solid #3DDC84;
        }

        .nav-links { display: flex; align-items: center; gap: 5px; }
        
        .nav-item {
            text-decoration: none; color: #bbb; 
            display: flex; align-items: center; justify-content: center;
            width: 45px; height: 45px;
            border-radius: 12px; transition: 0.3s;
        }
        
        .nav-item i { font-size: 1.3em; }

        .nav-item:hover, .nav-item.active { 
            color: #3DDC84; 
            background: rgba(61, 220, 132, 0.1); 
        }

        .nav-divider { width: 1px; height: 20px; background: #444; margin: 0 5px; }

        /* --- AUTH & ADMIN --- */
        .btn-login-toggle { background:transparent; color:#3DDC84; border:1px solid #3DDC84; padding:8px 16px; border-radius:20px; cursor:pointer; font-weight:bold; transition: 0.3s; }
        .btn-login-toggle:hover { background: #3DDC84; color: #121212; }

        .login-popup {
            display: none; position: absolute; top: 60px; right: 20px;
            background: #222; padding: 20px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 260px; 
            flex-direction: column; gap: 12px; z-index: 1001; border: 1px solid #333;
        }
        
        .login-popup input { 
            padding: 12px; border: 1px solid #444; border-radius: 8px; 
            outline: none; background: #121212; color: white; 
        }
        
        .remember-container { display: flex; align-items: center; gap: 8px; font-size: 0.8em; color: #999; }

        #admin-panel {
            background: #1e1e1e; padding: 25px; border-radius: 20px; margin: 20px 0;
            width: 90%; max-width: 600px; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px dashed #3DDC84;
        }
        .admin-input { 
            width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #333; 
            border-radius: 10px; background: #121212; color: white; 
        }
        .btn-add { 
            background: #3DDC84; color: #121212; border: none; padding: 14px; 
            border-radius: 10px; cursor: pointer; width: 100%; font-weight: 900; 
            text-transform: uppercase; font-family: 'Orbitron', sans-serif;
        }

        /* --- CONTENT --- */
        .container {
            flex: 1; width: 95%; max-width: 800px; text-align: center;
            background: rgba(30, 30, 30, 0.6); backdrop-filter: blur(10px);
            border-radius: 30px; padding: 40px 20px; margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .menu-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        
        .menu-wrapper { 
            position: relative; flex: 1 1 calc(50% - 20px); min-width: 160px; 
            border-radius: 20px; overflow: hidden;
        }
        
        .menu-item {
            display: flex; align-items: center; justify-content: center;
            width: 100%; min-height: 85px; padding: 20px;
            text-decoration: none; color: white; font-weight: 700;
            transition: 0.4s; font-size: 1.1em;
            background: #252525; border-bottom: 4px solid rgba(0,0,0,0.2);
        }
        .menu-item:hover { transform: scale(1.03); background: #2d2d2d; }

        .download-zone {
            position: absolute; right: 0; top: 0; bottom: 0;
            width: 55px; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.2); border-left: 1px solid rgba(255,255,255,0.1);
            color: #3DDC84; transition: 0.3s;
        }
        .download-zone:hover { background: #3DDC84; color: #121212; }

        .admin-controls { position: absolute; top: 5px; left: 5px; display: flex; gap: 5px; }
        .btn-ctrl {
            background: rgba(0,0,0,0.5); color: white; border: none;
            width: 28px; height: 28px; border-radius: 8px; cursor: pointer;
            font-size: 12px; transition: 0.2s;
        }
        .btn-ctrl:hover { background: #fff; color: #000; }

        footer { 
            width: 100%; padding: 25px; text-align: center; color: #666; 
            font-family: 'Orbitron', sans-serif; font-size: 0.8em; letter-spacing: 2px;
        }

        .badge-new { 
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            background: #3DDC84; color: #121212; font-size: 9px; 
            padding: 2px 10px; border-radius: 0 0 8px 8px; font-weight: 900; 
        }

        @media (max-width: 480px) { 
            .menu-wrapper { flex: 1 1 100%; }
            .brand-logo { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <nav class="toolbar">
        <div class="nav-links">
            <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i></a>
            <div class="nav-divider"></div>
            <a href="#" class="nav-item"><i class="fa-solid fa-code-branch"></i></a>
            <div class="nav-divider"></div>
            <a href="#" class="nav-item"><i class="fa-solid fa-microchip"></i></a>
        </div>
        
        <div class="auth-container" id="auth-wrapper">
            <button class="btn-login-toggle" onclick="toggleLoginForm(event)"><i class="fa-solid fa-terminal"></i> LOGIN</button>
            <div class="login-popup" id="login-popup">
                <input type="email" id="email" placeholder="Admin Email">
                <input type="password" id="password" placeholder="Access Code">
                <label class="remember-container">
                    <input type="checkbox" id="rememberMe"> Keep Session
                </label>
                <button class="btn-add" onclick="login()">EXECUTE</button>
            </div>
            <button id="btn-logout" style="display:none; background: #ff4757; color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer; font-weight:bold" onclick="logout()">LOGOUT</button>
        </div>
    </nav>

    <div class="brand-logo">SANTRIDROID</div>

    <div id="admin-panel">
        <h3 style="margin-bottom:15px; font-family:'Orbitron'">COMMAND CENTER</h3>
        <input type="text" id="title" class="admin-input" placeholder="Title/Label">
        <input type="text" id="url" class="admin-input" placeholder="Redirect URL">
        <input type="text" id="downloadUrl" class="admin-input" placeholder="Package/Download URL (Optional)">
        <button class="btn-add" onclick="addMenu()">DEPLOY MENU</button>
    </div>

    <div class="container">
        <div id="menu-container" class="menu-list"></div>
    </div>

    <footer>
        &copy; 2026 SANTRIDROID • CORE v2.0
    </footer>

    <script>
        // --- FIREBASE CONFIG (SANTRIDROID-LINK) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBuquQlJWdSUuHhmJBxBGa1LNzWUdFNdzE",
            authDomain: "santridroid-link.firebaseapp.com",
            databaseURL: "https://santridroid-link-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "santridroid-link",
            storageBucket: "santridroid-link.firebasestorage.app",
            messagingSenderId: "37630509146",
            appId: "1:37630509146:web:e1472cff08b34269721863",
            measurementId: "G-6YM0LDQTHN"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let isAdmin = false;
        let editingKey = null;
        let menuDataCache = {};

        window.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('sd_email');
            const savedPass = localStorage.getItem('sd_pass');
            if (savedEmail && savedPass) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('password').value = savedPass;
                document.getElementById('rememberMe').checked = true;
            }
        });

        function toggleLoginForm(event) {
            event.stopPropagation();
            const popup = document.getElementById('login-popup');
            popup.style.display = (popup.style.display === 'flex') ? 'none' : 'flex';
        }

        window.onclick = function(e) {
            if (!document.getElementById('auth-wrapper').contains(e.target)) {
                document.getElementById('login-popup').style.display = 'none';
            }
        };

        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const remember = document.getElementById('rememberMe').checked;

            auth.signInWithEmailAndPassword(email, pass)
            .then(() => {
                if(remember) {
                    localStorage.setItem('sd_email', email);
                    localStorage.setItem('sd_pass', pass);
                }
                document.getElementById('login-popup').style.display = 'none';
            })
            .catch((err) => alert("Access Denied: " + err.message));
        }

        function logout() { editingKey = null; auth.signOut(); }

        auth.onAuthStateChanged(user => {
            isAdmin = !!user;
            document.getElementById('admin-panel').style.display = isAdmin ? 'block' : 'none';
            document.getElementById('btn-logout').style.display = isAdmin ? 'block' : 'none';
            document.querySelector('.btn-login-toggle').style.display = isAdmin ? 'none' : 'block';
            renderMenus(); 
        });

        function formatUrl(input, isDl = false) {
            if (!input) return isDl ? "" : "#";
            if (input.startsWith('http')) return input;
            return "https://" + input;
        }

        function addMenu() {
            const title = document.getElementById('title').value;
            if(title) {
                db.ref('ubaid').push({
                    title, 
                    url: formatUrl(document.getElementById('url').value),
                    downloadUrl: formatUrl(document.getElementById('downloadUrl').value, true),
                    createdAt: new Date().toISOString().split('T')[0]
                }).then(() => {
                    document.getElementById('title').value = "";
                    document.getElementById('url').value = "";
                    document.getElementById('downloadUrl').value = "";
                });
            }
        }

        db.ref('ubaid').on('value', (snap) => {
            menuDataCache = snap.val() || {};
            renderMenus();
        });

        function renderMenus() {
            const container = document.getElementById('menu-container');
            container.innerHTML = "";
            
            for (let key in menuDataCache) {
                const data = menuDataCache[key];
                const isNew = Math.ceil(Math.abs(new Date() - new Date(data.createdAt)) / (1000 * 60 * 60 * 24)) <= 3;
                const wrapper = document.createElement('div');
                wrapper.className = 'menu-wrapper';

                if (isAdmin && editingKey === key) {
                    wrapper.innerHTML = `
                        <div style="background:#222; padding:15px; border:1px solid #3DDC84; border-radius:15px;">
                            <input type="text" id="ed-t-${key}" class="admin-input" value="${data.title}">
                            <input type="text" id="ed-u-${key}" class="admin-input" value="${data.url}">
                            <div style="display:flex; gap:5px;">
                                <button class="btn-add" style="font-size:10px; padding:8px" onclick="saveEdit('${key}')">SAVE</button>
                                <button class="btn-add" style="background:#444; color:#fff; font-size:10px; padding:8px" onclick="cancelEdit()">CANCEL</button>
                            </div>
                        </div>`;
                } else {
                    wrapper.innerHTML = `
                        ${isNew ? '<div class="badge-new">RECENT UPDATE</div>' : ''}
                        <a href="${data.url}" target="_blank" class="menu-item">
                            <span>${data.title}</span>
                        </a>
                        ${data.downloadUrl ? `<a href="${data.downloadUrl}" target="_blank" class="download-zone"><i class="fa-solid fa-download"></i></a>` : ''}
                        ${isAdmin ? `
                        <div class="admin-controls">
                            <button class="btn-ctrl" onclick="startEdit('${key}')"><i class="fa-solid fa-code"></i></button>
                            <button class="btn-ctrl" style="color:#ff4757" onclick="deleteMenu('${key}')"><i class="fa-solid fa-trash"></i></button>
                        </div>` : ''}`;
                }
                container.appendChild(wrapper);
            }
        }

        function startEdit(key) { editingKey = key; renderMenus(); }
        function cancelEdit() { editingKey = null; renderMenus(); }

        function saveEdit(key) {
            const title = document.getElementById(`ed-t-${key}`).value;
            if(title) {
                db.ref('ubaid/' + key).update({
                    title: title,
                    url: formatUrl(document.getElementById(`ed-u-${key}`).value)
                }).then(() => {
                    editingKey = null;
                    renderMenus();
                });
            }
        }

        function deleteMenu(key) { if(confirm("Terminate this menu?")) db.ref('ubaid/' + key).remove(); }
    </script>
</body>
</html>
