<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANTRIDROID - Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        @keyframes gradientBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #a1c4fd, #c2e9fb, #d4fc79, #96e6a1, #84fab0, #8fd3f4);
            background-size: 300% 300%;
            animation: gradientBackground 15s ease infinite;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- LOGO SANTRIDROID (Style Android Tetap Dipertahankan) --- */
        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            letter-spacing: 6px;
            color: #2ecc71; /* Hijau yang lebih cerah agar masuk ke UI Light */
            text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            margin: 25px 0;
            text-transform: uppercase;
        }

        /* --- TOOLBAR --- */
        .toolbar {
            width: 100%; background: rgba(255, 255, 255, 0.95);
            padding: 8px 15px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            position: sticky; top: 0; z-index: 1000;
        }

        .nav-links { display: flex; align-items: center; gap: 0; }
        .nav-item {
            text-decoration: none; color: #555; 
            display: flex; align-items: center; justify-content: center;
            width: 45px; height: 45px; border-radius: 12px; transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active { color: #2ecc71; background: rgba(46, 204, 113, 0.1); }
        .nav-divider { width: 1.5px; height: 22px; background: #e0e0e0; margin: 0 4px; }

        .auth-container { position: relative; }
        .login-popup {
            display: none; position: absolute; top: 50px; right: 0;
            background: white; padding: 15px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 240px; 
            flex-direction: column; gap: 10px; z-index: 1001;
        }
        .login-popup input { padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; }

        /* --- ADMIN PANEL --- */
        #admin-panel {
            background: white; padding: 25px; border-radius: 15px; margin: 20px 0;
            width: 90%; max-width: 600px; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .admin-input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #eee; border-radius: 8px; background: #f9f9f9; }
        .btn-add { background: #2ecc71; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }

        /* --- MENU CONTENT --- */
        .container {
            flex: 1; width: 95%; max-width: 750px; text-align: center;
            background: rgba(255, 255, 255, 0.9); border-radius: 30px;
            padding: 40px 25px; margin: 20px 0 50px 0; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }
        .menu-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 10px; }
        
        .menu-wrapper { 
            position: relative; flex: 1 1 calc(50% - 20px); min-width: 180px; 
            overflow: hidden; border-radius: 20px; transition: 0.3s;
            display: flex; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        /* GAYA TEXT BOX LINK (Ukuran 1.75em & Rata Tengah Sesuai Permintaan Sebelumnya) */
        .menu-item {
            display: flex; align-items: center; justify-content: center;
            width: 100%; min-height: 100px; 
            padding: 20px 55px; /* Memberi ruang untuk icon download */
            font-weight: 800; text-decoration: none; color: white; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 1.75em; text-align: center; text-transform: uppercase;
            line-height: 1.2;
        }
        .menu-item:hover { transform: translateY(-5px); filter: brightness(1.1); }

        .download-zone {
            position: absolute; right: 0; top: 0; bottom: 0;
            width: 50px; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.1); 
            border-left: 1.5px solid rgba(255,255,255,0.3);
            text-decoration: none; color: white; transition: 0.3s; z-index: 5;
        }
        .download-zone:hover { background: rgba(255,255,255,0.2); }

        .admin-controls { position: absolute; bottom: 8px; left: 8px; display: flex; gap: 4px; z-index: 10; }
        .btn-ctrl {
            background: rgba(0,0,0,0.2); color: white; border: none;
            width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 10px;
        }
        
        footer { width: 100%; padding: 25px; background: rgba(255,255,255,0.8); text-align: center; color: #666; margin-top: auto; font-family: 'Orbitron'; font-size: 0.7em; letter-spacing: 2px; }
        .badge-new { position: absolute; top: 8px; left: 8px; background: #ff4757; color: white; font-size: 8px; padding: 2px 8px; border-radius: 10px; font-weight: bold; z-index: 2; }

        @media (max-width: 480px) { 
            .menu-wrapper { flex: 1 1 100%; }
            .menu-item { font-size: 1.4em; min-height: 85px; }
        }
    </style>
</head>
<body>

    <nav class="toolbar">
        <div class="nav-links">
            <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i></a>
            <div class="nav-divider"></div>
            <a href="https://santridroid.github.io/note.html" class="nav-item"><i class="fa-solid fa-layer-group"></i></a>
            <div class="nav-divider"></div>
            <a href="#" class="nav-item"><i class="fa-solid fa-cloud"></i></a>
        </div>
        <div class="auth-container" id="auth-wrapper">
            <button onclick="toggleLoginForm(event)" style="background:none; color:#555; border:1px solid #ddd; padding:8px 12px; border-radius:20px; cursor:pointer"><i class="fa-solid fa-user-lock"></i> Login</button>
            <div class="login-popup" id="login-popup">
                <input type="email" id="email" placeholder="Email Admin">
                <input type="password" id="password" placeholder="Password">
                <button class="btn-add" onclick="login()">Masuk</button>
            </div>
            <button id="btn-logout" style="display:none; background: #ff4757; color:white; border:none; padding:8px 15px; border-radius:20px; cursor:pointer" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="brand-logo">SANTRIDROID</div>

    <div id="admin-panel">
        <h3 style="margin-bottom:10px">Panel Navigasi Santridroid</h3>
        <input type="text" id="title" class="admin-input" placeholder="Nama Menu">
        <input type="text" id="url" class="admin-input" placeholder="Link Tujuan">
        <input type="text" id="downloadUrl" class="admin-input" placeholder="Link Download (Opsional)">
        <button class="btn-add" onclick="addMenu()">Tambahkan Menu</button>
    </div>

    <div class="container">
        <div id="menu-container" class="menu-list"></div>
    </div>

    <footer>
        &copy; Shopee Link • Powered By SANTRIDROID
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBuquQlJWdSUuHhmJBxBGa1LNzWUdFNdzE",
            authDomain: "santridroid-link.firebaseapp.com",
            databaseURL: "https://santridroid-link-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "santridroid-link",
            storageBucket: "santridroid-link.firebasestorage.app",
            messagingSenderId: "37630509146",
            appId: "1:37630509146:web:e1472cff08b34269721863",
            measurementId: "G-6YM0LDQTHN"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let isAdmin = false;
        let editingKey = null;
        let menuDataCache = {};

        // Warna Vibrant untuk Tombol Link
        const linkColors = ['#2ecc71', '#3498db', '#9b59b6', '#f1c40f', '#e67e22', '#1abc9c', '#e74c3c', '#2c3e50'];

        function toggleLoginForm(event) {
            event.stopPropagation();
            const popup = document.getElementById('login-popup');
            popup.style.display = (popup.style.display === 'flex') ? 'none' : 'flex';
        }

        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, pass).then(() => {
                document.getElementById('login-popup').style.display = 'none';
            }).catch((err) => alert("Gagal: " + err.message));
        }

        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            isAdmin = !!user;
            document.getElementById('admin-panel').style.display = isAdmin ? 'block' : 'none';
            document.getElementById('btn-logout').style.display = isAdmin ? 'block' : 'none';
            document.querySelector('[onclick="toggleLoginForm(event)"]').style.display = isAdmin ? 'none' : 'block';
            renderMenus(); 
        });

        function addMenu() {
            const title = document.getElementById('title').value;
            const url = document.getElementById('url').value;
            if(title) {
                db.ref('ubaid').push({
                    title, 
                    url: url.startsWith('http') ? url : 'https://' + url,
                    downloadUrl: document.getElementById('downloadUrl').value,
                    createdAt: new Date().toISOString().split('T')[0]
                }).then(() => {
                    document.getElementById('title').value = "";
                    document.getElementById('url').value = "";
                });
            }
        }

        db.ref('ubaid').on('value', (snap) => {
            menuDataCache = snap.val() || {};
            renderMenus();
        });

        function renderMenus() {
            const container = document.getElementById('menu-container');
            container.innerHTML = "";
            
            let i = 0;
            for (let key in menuDataCache) {
                const data = menuDataCache[key];
                const isNew = Math.ceil(Math.abs(new Date() - new Date(data.createdAt)) / (1000 * 60 * 60 * 24)) <= 7;
                const themeColor = linkColors[i % linkColors.length];
                const wrapper = document.createElement('div');
                wrapper.className = 'menu-wrapper';

                if (isAdmin && editingKey === key) {
                    wrapper.innerHTML = `
                        <div style="background:#fff; padding:15px; width:100%; border:2px solid ${themeColor}; border-radius:20px;">
                            <input type="text" id="ed-t-${key}" class="admin-input" value="${data.title}">
                            <button class="btn-add" style="background:${themeColor}" onclick="saveEdit('${key}')">SIMPAN</button>
                        </div>`;
                } else {
                    wrapper.innerHTML = `
                        ${isNew ? '<div class="badge-new">NEW</div>' : ''}
                        <a href="${data.url}" target="_blank" class="menu-item" style="background:${themeColor}">
                            <span>${data.title}</span>
                        </a>
                        ${data.downloadUrl ? `<a href="${data.downloadUrl}" target="_blank" class="download-zone"><i class="fa-solid fa-download"></i></a>` : ''}
                        ${isAdmin ? `
                        <div class="admin-controls">
                            <button class="btn-ctrl" onclick="editingKey='${key}';renderMenus()"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-ctrl" style="background:#e74c3c" onclick="deleteMenu('${key}')"><i class="fa-solid fa-trash"></i></button>
                        </div>` : ''}`;
                }
                container.appendChild(wrapper);
                i++;
            }
        }

        function saveEdit(key) {
            const title = document.getElementById(`ed-t-${key}`).value;
            if(title) {
                db.ref('ubaid/' + key).update({ title }).then(() => {
                    editingKey = null; renderMenus();
                });
            }
        }

        function deleteMenu(key) { if(confirm("Hapus?")) db.ref('ubaid/' + key).remove(); }
    </script>
</body>
</html>
