<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANTRIDROID - Notes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        /* CSS DISESUAIKAN DENGAN HALAMAN UTAMA */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        @keyframes gradientBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #a1c4fd, #c2e9fb, #d4fc79, #96e6a1, #84fab0, #8fd3f4);
            background-size: 300% 300%;
            animation: gradientBackground 15s ease infinite;
            display: flex; flex-direction: column; align-items: center;
        }

        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900; font-size: 2.2rem; letter-spacing: 6px;
            color: #2ecc71; text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            margin: 25px 0; text-transform: uppercase;
        }

        /* --- TOOLBAR --- */
        .toolbar {
            width: 100%; background: rgba(255, 255, 255, 0.95);
            padding: 8px 15px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            position: sticky; top: 0; z-index: 1000;
        }

        .nav-links { display: flex; align-items: center; gap: 0; }
        .nav-item {
            text-decoration: none; color: #555; 
            display: flex; align-items: center; justify-content: center;
            width: 45px; height: 45px; border-radius: 12px; transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active { color: #2ecc71; background: rgba(46, 204, 113, 0.1); }
        .nav-divider { width: 1.5px; height: 22px; background: #e0e0e0; margin: 0 4px; }

        /* --- LOGIN POPUP --- */
        .auth-container { position: relative; }
        .login-popup {
            display: none; position: absolute; top: 50px; right: 0;
            background: white; padding: 15px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 240px; 
            flex-direction: column; gap: 10px; z-index: 1001;
        }
        .login-popup input { padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; }

        /* --- TAB SWITCHER --- */
        .tab-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            background: rgba(255,255,255,0.7); border: none; padding: 8px 20px;
            border-radius: 20px; cursor: pointer; font-weight: bold; color: #555; transition: 0.3s;
        }
        .tab-btn.active { background: #2ecc71; color: white; }

        /* --- ADMIN PANEL (ADD NOTE) --- */
        #admin-panel {
            background: white; padding: 25px; border-radius: 15px; margin: 20px 0;
            width: 90%; max-width: 600px; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .admin-input { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #eee; border-radius: 8px; background: #f9f9f9; }
        textarea.admin-input { min-height: 120px; resize: vertical; }
        .btn-add { background: #2ecc71; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }

        /* --- NOTES GRID --- */
        .container {
            flex: 1; width: 95%; max-width: 900px; text-align: center;
            background: rgba(255, 255, 255, 0.9); border-radius: 30px;
            padding: 40px 25px; margin: 20px 0 50px 0; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }
        .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        
        .note-card {
            position: relative; padding: 20px; border-radius: 20px; color: white;
            text-align: left; cursor: pointer; transition: 0.3s; height: 150px;
            display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .note-card:hover { transform: translateY(-5px); filter: brightness(1.1); }
        .note-title { font-weight: 800; font-size: 1.2rem; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .note-preview { font-size: 0.85rem; opacity: 0.9; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        /* --- MODAL DETAIL --- */
        .modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white; width: 90%; max-width: 500px; padding: 25px;
            border-radius: 20px; position: relative;
        }
        .btn-close { position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 1.2rem; color: #999; }

        .admin-controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; }
        .btn-ctrl {
            background: rgba(0,0,0,0.2); color: white; border: none;
            width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 10px;
        }

        footer { width: 100%; padding: 25px; background: rgba(255,255,255,0.8); text-align: center; color: #666; margin-top: auto; font-family: 'Orbitron'; font-size: 0.7em; letter-spacing: 2px; }
    </style>
</head>
<body>

    <nav class="toolbar">
        <div class="nav-links">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i></a>
            <div class="nav-divider"></div>
            <a href="#" class="nav-item active"><i class="fa-solid fa-layer-group"></i></a>
            <div class="nav-divider"></div>
            <a href="#" class="nav-item"><i class="fa-solid fa-cloud"></i></a>
        </div>
        <div class="auth-container">
            <button id="btn-login-trigger" onclick="toggleLoginForm(event)" style="background:none; color:#555; border:1px solid #ddd; padding:8px 12px; border-radius:20px; cursor:pointer"><i class="fa-solid fa-user-lock"></i> Login</button>
            <div class="login-popup" id="login-popup">
                <input type="email" id="email" placeholder="Email Admin">
                <input type="password" id="password" placeholder="Password">
                <button class="btn-add" onclick="login()">Masuk</button>
            </div>
            <button id="btn-logout" style="display:none; background: #ff4757; color:white; border:none; padding:8px 15px; border-radius:20px; cursor:pointer" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="brand-logo">NOTES</div>

    <div class="tab-container">
        <button id="tab-pub" class="tab-btn active" onclick="switchTab('public')">PUBLIC</button>
        <button id="tab-priv" class="tab-btn" style="display:none;" onclick="switchTab('private')">PRIVATE 🔒</button>
    </div>

    <div id="admin-panel">
        <h3 style="margin-bottom:10px" id="panel-title">Tambah Catatan Publik</h3>
        <input type="text" id="note-title-input" class="admin-input" placeholder="Judul Catatan">
        <textarea id="note-content-input" class="admin-input" placeholder="Isi catatan atau script..."></textarea>
        <button class="btn-add" onclick="handleSave()">Simpan Catatan</button>
    </div>

    <div class="container">
        <div id="notes-grid" class="notes-grid"></div>
    </div>

    <div id="detail-modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <i class="fa-solid fa-xmark btn-close" onclick="closeModal()"></i>
            <h2 id="view-title" style="margin-bottom:15px; color:#333;"></h2>
            <textarea id="view-content" class="admin-input" style="height:300px; background:#f0f2f5;" readonly></textarea>
            <button class="btn-add" style="margin-top:10px; background:#3498db" onclick="copyNote()">Salin Teks</button>
        </div>
    </div>

    <footer>
        &copy; Shopee Link • Powered By SANTRIDROID
    </footer>

    <script>
        // CONFIG FIREBASE SAMA DENGAN HALAMAN UTAMA
        const firebaseConfig = {
            apiKey: "AIzaSyBuquQlJWdSUuHhmJBxBGa1LNzWUdFNdzE",
            authDomain: "santridroid-link.firebaseapp.com",
            databaseURL: "https://santridroid-link-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "santridroid-link",
            storageBucket: "santridroid-link.firebasestorage.app",
            messagingSenderId: "37630509146",
            appId: "1:37630509146:web:e1472cff08b34269721863",
            measurementId: "G-6YM0LDQTHN"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let currentTab = 'public';
        let isAdmin = false;
        const colors = ['#2ecc71', '#3498db', '#9b59b6', '#f1c40f', '#e67e22', '#e74c3c'];

        function toggleLoginForm(event) {
            event.stopPropagation();
            const popup = document.getElementById('login-popup');
            popup.style.display = (popup.style.display === 'flex') ? 'none' : 'flex';
        }

        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, pass).then(() => {
                document.getElementById('login-popup').style.display = 'none';
            }).catch((err) => alert("Gagal: " + err.message));
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        auth.onAuthStateChanged(user => {
            isAdmin = !!user;
            document.getElementById('admin-panel').style.display = isAdmin ? 'block' : 'none';
            document.getElementById('btn-logout').style.display = isAdmin ? 'block' : 'none';
            document.getElementById('btn-login-trigger').style.display = isAdmin ? 'none' : 'block';
            document.getElementById('tab-priv').style.display = isAdmin ? 'block' : 'none';
            initSync();
        });

        function switchTab(t) {
            currentTab = t;
            document.getElementById('tab-pub').classList.toggle('active', t === 'public');
            document.getElementById('tab-priv').classList.toggle('active', t === 'private');
            document.getElementById('panel-title').innerText = t === 'public' ? "Tambah Catatan Publik" : "Tambah Catatan Privat";
            initSync();
        }

        function initSync() {
            const grid = document.getElementById('notes-grid');
            grid.innerHTML = '';
            const path = (currentTab === 'private' && isAdmin) ? `notes/private/${auth.currentUser.uid}` : 'notes/public';
            
            db.ref(path).off();
            db.ref(path).on('value', snap => {
                grid.innerHTML = '';
                let i = 0;
                snap.forEach(child => {
                    const data = child.val();
                    const key = child.key;
                    const color = colors[i % colors.length];
                    
                    const card = document.createElement('div');
                    card.className = 'note-card';
                    card.style.backgroundColor = color;
                    card.onclick = () => openModal(data.title, data.content);
                    
                    card.innerHTML = `
                        <div class="note-title">${data.title}</div>
                        <div class="note-preview">${data.content}</div>
                        ${isAdmin ? `
                        <div class="admin-controls">
                            <button class="btn-ctrl" onclick="event.stopPropagation(); deleteNote('${key}')"><i class="fa-solid fa-trash"></i></button>
                        </div>` : ''}
                    `;
                    grid.prepend(card);
                    i++;
                });
            });
        }

        function handleSave() {
            const title = document.getElementById('note-title-input').value;
            const content = document.getElementById('note-content-input').value;
            if(!title || !content) return alert("Isi semua field!");

            const path = (currentTab === 'private') ? `notes/private/${auth.currentUser.uid}` : 'notes/public';
            db.ref(path).push({ title, content, createdAt: Date.now() }).then(() => {
                document.getElementById('note-title-input').value = "";
                document.getElementById('note-content-input').value = "";
            });
        }

        function deleteNote(key) {
            if(confirm("Hapus catatan ini?")) {
                const path = (currentTab === 'private') ? `notes/private/${auth.currentUser.uid}` : 'notes/public';
                db.ref(`${path}/${key}`).remove();
            }
        }

        function openModal(title, content) {
            document.getElementById('view-title').innerText = title;
            document.getElementById('view-content').value = content;
            document.getElementById('detail-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detail-modal').style.display = 'none';
        }

        function copyNote() {
            const content = document.getElementById('view-content');
            content.select();
            document.execCommand('copy');
            alert("Teks berhasil disalin!");
        }

        // Close popup when clicking outside
        window.onclick = (e) => {
            const popup = document.getElementById('login-popup');
            if (e.target.closest('.auth-container') === null) {
                popup.style.display = 'none';
            }
        };
    </script>
</body>
</html>
